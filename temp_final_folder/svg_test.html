<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4AD Dungeon Tiles</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1, h2 { text-align: center; }
    .tile-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .tile { text-align: center; }
    svg { width: 100px; height: 100px; border: 1px solid #ccc; }
    .label { margin-top: 5px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>4AD Dungeon Tiles</h1>

  <h2>Entrance Rooms (Roll 1–6)</h2>
  <div class="tile-grid">
    <!-- Entrance Room 1 -->
    <div class="tile">
      <svg id="entrance-room-1" viewBox="0 0 100 100">
        <defs>
          <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="#fff"/>
            <path d="M4 0 L0 0 0 4" fill="none" stroke="#ddd" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="url(#grid)"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Door north -->
        <rect x="48" y="10" width="4" height="2" fill="#fff"/>
        <circle cx="50" cy="10" r="0" id="conn-n"/>
      </svg>
      <div class="label">entrance-room-1</div>
    </div>

    <!-- Entrance Room 2 -->
    <div class="tile">
      <svg id="entrance-room-2" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Door south -->
        <rect x="48" y="88" width="4" height="2" fill="#fff"/>
        <circle cx="50" cy="90" r="0" id="conn-s"/>
      </svg>
      <div class="label">entrance-room-2</div>
    </div>

    <!-- Entrance Room 3 -->
    <div class="tile">
      <svg id="entrance-room-3" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Door east -->
        <rect x="88" y="48" width="2" height="4" fill="#fff"/>
        <circle cx="90" cy="50" r="0" id="conn-e"/>
      </svg>
      <div class="label">entrance-room-3</div>
    </div>

    <!-- Entrance Room 4 -->
    <div class="tile">
      <svg id="entrance-room-4" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Door west -->
        <rect x="10" y="48" width="2" height="4" fill="#fff"/>
        <circle cx="10" cy="50" r="0" id="conn-w"/>
      </svg>
      <div class="label">entrance-room-4</div>
    </div>

    <!-- Entrance Room 5 -->
    <div class="tile">
      <svg id="entrance-room-5" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Doors north & south -->
        <rect x="48" y="10" width="4" height="2" fill="#fff"/>
        <rect x="48" y="88" width="4" height="2" fill="#fff"/>
        <circle cx="50" cy="10" r="0" id="conn-n"/>
        <circle cx="50" cy="90" r="0" id="conn-s"/>
      </svg>
      <div class="label">entrance-room-5</div>
    </div>

    <!-- Entrance Room 6 -->
    <div class="tile">
      <svg id="entrance-room-6" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="none" stroke="#222" stroke-width="2"/>
        <!-- Door north off-center -->
        <rect x="30" y="10" width="4" height="2" fill="#fff"/>
        <circle cx="32" cy="10" r="0" id="conn-n"/>
      </svg>
      <div class="label">entrance-room-6</div>
    </div>
  </div>

  <h2>Internal Rooms/Corridors (Roll 2–12)</h2>
  <div class="tile-grid">
    <!-- Corridor 2 -->
    <div class="tile">
      <svg id="tile-2" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="40" y="0" width="20" height="100" fill="url(#grid)" stroke="#222" stroke-width="2"/>
        <circle cx="50" cy="0" r="0" id="conn-n"/>
        <circle cx="50" cy="100" r="0" id="conn-s"/>
      </svg>
      <div class="label">tile-2 corridor</div>
    </div>

    <!-- Corridor 3 -->
    <div class="tile">
      <svg id="tile-3" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="0" y="40" width="100" height="20" fill="url(#grid)" stroke="#222" stroke-width="2"/>
        <circle cx="0" cy="50" r="0" id="conn-w"/>
        <circle cx="100" cy="50" r="0" id="conn-e"/>
      </svg>
      <div class="label">tile-3 corridor</div>
    </div>

    <!-- Room 4 -->
    <div class="tile">
      <svg id="tile-4" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="url(#grid)" stroke="#222" stroke-width="2"/>
      </svg>
      <div class="label">tile-4 room</div>
    </div>

    <!-- Room 5 with north door -->
    <div class="tile">
      <svg id="tile-5" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="10" y="10" width="80" height="80" fill="url(#grid)" stroke="#222" stroke-width="2"/>
        <rect x="48" y="10" width="4" height="2" fill="#fff"/>
        <circle cx="50" cy="10" r="0" id="conn-n"/>
      </svg>
      <div class="label">tile-5 room (N door)</div>
    </div>

    <!-- T-corridor 6 -->
    <div class="tile">
      <svg id="tile-6" viewBox="0 0 100 100">
        <use href="#grid"/>
        <rect x="40" y="0" width="20" height="60" fill="url(#grid)" stroke="#222" stroke-width="2"/>
        <rect x="0" y="40" width="100" height="20" fill="url(#grid)" stroke="#222" stroke-width="2"/>
