<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .hero-bg { fill: #1a1a1a; }
      .floor { fill: #5a5a4a; }
      .wall { fill: #2a2a2a; stroke: #3a3a3a; stroke-width: 2; }
      .door { fill: #8b4513; stroke: #654321; stroke-width: 2; }
      .accent { fill: #4ade80; }
      .highlight { fill: #fbbf24; }
      .text { fill: #e5e5e5; font-family: Arial, sans-serif; font-weight: bold; }
    </style>
    
    <!-- Gradient for depth -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a6a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a3a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect class="hero-bg" width="800" height="400"/>
  
  <!-- Dungeon floor pattern -->
  <rect fill="url(#floorGrad)" x="50" y="50" width="700" height="300" rx="4"/>
  
  <!-- Grid lines -->
  <g opacity="0.3">
    <line x1="150" y1="50" x2="150" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="250" y1="50" x2="250" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="350" y1="50" x2="350" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="450" y1="50" x2="450" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="550" y1="50" x2="550" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="650" y1="50" x2="650" y2="350" stroke="#3a3a3a" stroke-width="1"/>
    
    <line x1="50" y1="120" x2="750" y2="120" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="50" y1="190" x2="750" y2="190" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="50" y1="260" x2="750" y2="260" stroke="#3a3a3a" stroke-width="1"/>
  </g>
  
  <!-- Walls -->
  <rect fill="url(#wallGrad)" x="150" y="120" width="100" height="20" rx="2"/>
  <rect fill="url(#wallGrad)" x="550" y="120" width="100" height="20" rx="2"/>
  <rect fill="url(#wallGrad)" x="350" y="260" width="100" height="20" rx="2"/>
  
  <!-- Doors -->
  <rect class="door" x="320" y="120" width="60" height="20" rx="2"/>
  <rect class="door" x="480" y="260" width="60" height="20" rx="2"/>
  
  <!-- Character tokens -->
  <g transform="translate(200, 200)">
    <circle class="accent" r="15"/>
    <text class="text" x="0" y="5" font-size="12" text-anchor="middle">⚔️</text>
  </g>
  
  <g transform="translate(280, 200)">
    <circle class="accent" r="15"/>
    <text class="text" x="0" y="5" font-size="12" text-anchor="middle">🛡️</text>
  </g>
  
  <g transform="translate(520, 200)">
    <circle class="highlight" r="15"/>
    <text class="text" x="0" y="5" font-size="12" text-anchor="middle">🏹</text>
  </g>
  
  <g transform="translate(600, 200)">
    <circle class="highlight" r="15"/>
    <text class="text" x="0" y="5" font-size="12" text-anchor="middle">✨</text>
  </g>
  
  <!-- Title overlay -->
  <g opacity="0.9">
    <rect fill="#1a1a1a" x="200" y="320" width="400" height="60" rx="8"/>
    <text class="text accent" x="400" y="350" font-size="24" text-anchor="middle">FOUR AGAINST DARKNESS</text>
    <text class="text" x="400" y="370" font-size="14" text-anchor="middle" opacity="0.8">Digital Companion</text>
  </g>
</svg>
